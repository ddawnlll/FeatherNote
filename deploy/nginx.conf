# FeatherNote reverse proxy sample. Keep the Zig process on loopback.
# Replace notes.example.com and certificate paths before use.

# Do not log query strings: searches can contain private text.
log_format feathernote '$remote_addr - $status $request_method $uri $body_bytes_sent';
access_log /var/log/nginx/feathernote.access.log feathernote;

server {
    listen 80;
    listen [::]:80;
    server_name notes.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name notes.example.com;

    ssl_certificate     /etc/letsencrypt/live/notes.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notes.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    server_tokens off;
    client_max_body_size 330k;
    client_body_timeout 15s;
    client_header_timeout 10s;

    # The application emits its own restrictive CSP, nosniff and frame headers.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
        proxy_buffering on;
    }
}
