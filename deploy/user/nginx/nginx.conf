worker_processes 1;
pid /home/quant/local/nginx/run/nginx.pid;
error_log /home/quant/local/nginx/logs/error.log warn;

events {
    worker_connections 256;
}

http {
    include /home/quant/local/nginx/etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log off;
    sendfile on;
    keepalive_timeout 30;
    server_tokens off;

    client_max_body_size 330k;
    client_body_timeout 15s;
    client_header_timeout 10s;
    client_body_temp_path /home/quant/local/nginx/tmp/client_body;
    proxy_temp_path /home/quant/local/nginx/tmp/proxy;
    fastcgi_temp_path /home/quant/local/nginx/tmp/fastcgi;
    uwsgi_temp_path /home/quant/local/nginx/tmp/uwsgi;
    scgi_temp_path /home/quant/local/nginx/tmp/scgi;

    include /home/quant/local/nginx/conf.d/*.conf;
}
